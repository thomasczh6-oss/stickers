name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
      - name: Bundle the mobile app (JS only, no native build)
        run: pnpm --filter @stickers/mobile check:bundle
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_OFFLINE: "1"
